services:
  dev:
    # A purescript-tools release tag (debian-purescript-<purs>-build-<date>.<run>)
    # pinned by digest; Dependabot bumps tag and digest together.
    image: ghcr.io/flipstone/purescript-tools:debian-purescript-0.15.16-build-2026.10.22.59@sha256:f06a3ace0d900ff7a4ef20686199781e9770727138d74078716d70af641ad207
    environment:
      IN_CONTAINER: 'true'
    stdin_open: true
    tty: true
    volumes:
      - .:/purescript-erumu
    command: ./scripts/build
    working_dir: /purescript-erumu

