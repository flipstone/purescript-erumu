services:
  dev:
    # A purescript-tools release tag (debian-purescript-<purs>-build-<date>.<run>)
    # pinned by digest; Dependabot bumps tag and digest together.
    image: ghcr.io/flipstone/purescript-tools:debian-purescript-0.15.16-build-2026.9.11.50@sha256:1cfead28fa14e5978461f352548f2ed24f8c2cae553af8850a0283077baca813
    environment:
      IN_CONTAINER: 'true'
    stdin_open: true
    tty: true
    volumes:
      - .:/purescript-erumu
    command: ./scripts/build
    working_dir: /purescript-erumu

